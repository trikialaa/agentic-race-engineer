<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nova 3 Transcribe</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <h1>Nova 3 Transcribe</h1>
    <p>
      Hold / press the <strong id="hotkey-label">R</strong> key or the button below to
      record, release to transcribe.
    </p>
    <div class="controls">
      <button id="record-btn" type="button">Hold key or click</button>
      <button id="hotkey-btn" type="button">Set hotkey</button>
    </div>
    <p id="status">Waiting for input...</p>
    <div id="latency" aria-live="polite">
      <span class="latency-label">Latency</span>
      <div class="latency-grid">
        <div class="latency-row">
          <span>STT</span>
          <span id="latency-stt">--</span>
        </div>
        <div class="latency-row">
          <span>LLM</span>
          <span id="latency-llm">--</span>
        </div>
        <div class="latency-row">
          <span>TTS</span>
          <span id="latency-tts">--</span>
        </div>
      </div>
    </div>
    <section>
      <h2>Transcripts</h2>
      <ul id="transcript-list"></ul>
    </section>
  </main>
  <script src="app.js" type="module"></script>
</body>

</html>
