<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F1 Radio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <header id="app-header">
      <span class="app-title">F1 RADIO</span>
      <span id="session-dot" class="session-dot" title="Race session inactive"></span>
    </header>

    <section id="radio-section">
      <button id="record-btn" type="button" disabled>
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
          <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
          <line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="8.5" y1="22" x2="15.5" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <p id="record-hint">HOLD <span id="hotkey-label">R</span> OR CLICK</p>
      <p id="status">Waiting for race session…</p>
    </section>

    <div class="divider"></div>

    <section id="config-section">

      <div class="config-row">
        <span class="config-label">HOTKEY</span>
        <div class="config-control">
          <button id="hotkey-btn" type="button" class="ghost-btn">Rebind</button>
        </div>
      </div>

      <div class="config-row">
        <label class="config-label" for="cfg-udp-port">UDP PORT</label>
        <input id="cfg-udp-port" class="config-input" type="number" min="1024" max="65535" placeholder="20777">
      </div>

      <div class="config-row">
        <label class="config-label" for="cfg-server-port">SERVER PORT</label>
        <input id="cfg-server-port" class="config-input" type="number" min="1024" max="65535" placeholder="8080">
      </div>

      <div class="config-row config-row--stacked">
        <span class="config-label">ACTIVE SESSIONS</span>
        <div id="cfg-session-types" class="config-checks">
          <label><input type="checkbox" value="Race"> Grand Prix</label>
          <label><input type="checkbox" value="Race 2"> Sprint</label>
          <label><input type="checkbox" value="Feature Race"> Feature Race</label>
          <label><input type="checkbox" value="Qualifying"> Qualifying</label>
          <label><input type="checkbox" value="Sprint Shootout"> Sprint Shootout</label>
          <label><input type="checkbox" value="Practice 1"> Practice</label>
        </div>
      </div>

      <div class="config-row">
        <span class="config-label">OVERLAY SIDE</span>
        <div class="config-radios">
          <label><input type="radio" name="overlay-side" value="right"> Right</label>
          <label><input type="radio" name="overlay-side" value="left"> Left</label>
        </div>
      </div>

      <div class="config-row">
        <label class="config-label" for="cfg-dismiss-speed">DISMISS SPEED</label>
        <select id="cfg-dismiss-speed" class="config-select">
          <option value="slow">Slow</option>
          <option value="normal">Normal</option>
          <option value="fast">Fast</option>
        </select>
      </div>

      <div class="config-row">
        <label class="config-label" for="cfg-callouts">ENGINEER CALLOUTS</label>
        <select id="cfg-callouts" class="config-select">
          <option value="off">Off</option>
          <option value="critical">Critical only</option>
          <option value="critical_relevant">Critical + Relevant</option>
        </select>
      </div>

      <div class="config-row">
        <label class="config-label" for="cfg-mic-enhancement">MIC ENHANCEMENT</label>
        <select id="cfg-mic-enhancement" class="config-select">
          <option value="off">Off</option>
          <option value="standard">Noise Reduction</option>
          <option value="ai">AI Noise Cancellation</option>
        </select>
      </div>

      <div class="config-row">
        <label class="config-label" for="cfg-mic-device">INPUT DEVICE</label>
        <select id="cfg-mic-device" class="config-select" style="max-width:160px"></select>
      </div>

      <div class="config-row">
        <span class="config-label">MIC TEST</span>
        <button id="mic-test-btn" type="button" class="ghost-btn" disabled>Hold to Test</button>
      </div>

    </section>

    <footer id="app-footer">
      <p class="restart-notice">⚠ UDP port and server port require a restart</p>
      <button id="save-btn" type="button">Save Settings</button>
    </footer>

  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
