name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: mypy
        run: mypy src/mcp/functions src/udp_parser

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Placeholders so STT/TTS/Agent can instantiate at module import without real keys.
      # Tests never actually call these services.
      DEEPGRAM_API_KEY: "placeholder"
      INWORLD_API_KEY: "placeholder"
      INWORLD_BASE_URL: "http://localhost"
      BASETEN_API_KEY: "placeholder"
      BASETEN_BASE_URL: "http://localhost"
      BASETEN_MODEL: "placeholder"
      F1_BUFFER_CAR_TELEMETRY: "120"
      F1_BUFFER_CAR_STATUS: "100"
      F1_BUFFER_CAR_DAMAGE: "100"
      F1_BUFFER_LAP_EVENTS: "200"
      F1_BUFFER_CAR_SETUPS: "20"
      F1_BUFFER_SESSION: "200"
      F1_BUFFER_FORECAST: "50"
      F1_BUFFER_MARSHAL: "200"
      F1_BUFFER_MOTION_LAPS: "5"
      F1_BUFFER_MOTION_SAMPLES: "300"
      F1_BUFFER_LAP_HISTORY: "50"
      F1_BUFFER_POSITION_CHANGES: "200"
      F1_BUFFER_PIT_EVENTS: "100"
      F1_EVENTS_BUFFER: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-fail-under=68 -v
