name: Evals

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Runs per scenario (1–5)"
        default: "1"
        required: false
      judge:
        description: "Enable LLM-as-judge (true/false)"
        default: "false"
        required: false
  schedule:
    # Weekly on Monday at 03:00 UTC
    - cron: "0 3 * * 1"

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    name: Agent quality evals
    runs-on: ubuntu-latest
    env:
      # Real LLM keys — set as repo secrets
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
      JUDGE_BASE_URL: ${{ secrets.JUDGE_BASE_URL }}
      JUDGE_MODEL: ${{ secrets.JUDGE_MODEL }}
      # Placeholder keys so STT/TTS modules can import without raising at construction
      DEEPGRAM_API_KEY: "placeholder"
      INWORLD_API_KEY: "placeholder"
      INWORLD_BASE_URL: "http://localhost"
      # Buffer sizes
      F1_BUFFER_CAR_TELEMETRY: "120"
      F1_BUFFER_CAR_STATUS: "100"
      F1_BUFFER_CAR_DAMAGE: "100"
      F1_BUFFER_LAP_EVENTS: "200"
      F1_BUFFER_CAR_SETUPS: "20"
      F1_BUFFER_SESSION: "200"
      F1_BUFFER_FORECAST: "50"
      F1_BUFFER_MARSHAL: "200"
      F1_BUFFER_MOTION_LAPS: "5"
      F1_BUFFER_MOTION_SAMPLES: "300"
      F1_BUFFER_LAP_HISTORY: "50"
      F1_BUFFER_POSITION_CHANGES: "200"
      F1_BUFFER_PIT_EVENTS: "100"
      F1_EVENTS_BUFFER: "100"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run evals
        run: |
          JUDGE_FLAG=""
          if [ "${{ github.event.inputs.judge }}" = "true" ]; then
            JUDGE_FLAG="--judge"
          fi
          REPEATS="${{ github.event.inputs.repeats }}"
          REPEATS="${REPEATS:-1}"
          python -m evals.runner $JUDGE_FLAG --repeats "$REPEATS" --out evals/results/ci.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: evals/results/ci.json
          retention-days: 30
